# hybrid.cfg -- v++ link config: DPUCZDX8G B4096 + optimised LCAM gate
#
# This is the Option-B design: the DPU keeps running the 111 conv layers it
# is good at, and the one operator it CANNOT express natively -- the LCAM
# attention gate, which currently falls back to the ARM CPU at 83.2 ms --
# runs in the PL alongside it.
#
# Why the Vitis link flow instead of the Vivado block design we already
# built (kv260_hybrid_v2): in the Vivado flow the DPU is a raw IP, so XRT
# registered it from IP_LAYOUT and drove it with the generic AP_CTRL_HS
# handshake -- writing ap_start into what is actually a read-only DPU
# version register, and hanging CU(0). Packaging through v++ uses the
# DPU's own kernel.xml, so XRT/VART drive it with the correct protocol.
#
# Clocks come from the extensible platform built in kv260_ext_pfm:
#   index 0 = 100 MHz, index 1 = 300 MHz, index 2 = 600 MHz
# The DPU needs both 300 (aclk) and 600 (ap_clk_2, the DSP double-rate
# clock). The LCAM kernel synthesised at Fmax 411 MHz, so 300 MHz is safe
# and it shares the DPU's clock domain -- no extra clock crossing.

[clock]
freqHz=300000000:DPUCZDX8G_1.aclk
freqHz=600000000:DPUCZDX8G_1.ap_clk_2
freqHz=300000000:lcam_attention_gate_opt_1.ap_clk

[connectivity]

nk=DPUCZDX8G:1:DPUCZDX8G_1
nk=lcam_attention_gate_opt:1:lcam_attention_gate_opt_1

# DPU: instruction/control fetch on HPC0, the two data ports on HP0/HP1
# (same assignment as the stock prj_config_1dpu, so DPU behaviour and
# performance match the 5.13 ms baseline we measured).
sp=DPUCZDX8G_1.M_AXI_GP0:HPC0
sp=DPUCZDX8G_1.M_AXI_HP0:HP0
sp=DPUCZDX8G_1.M_AXI_HP2:HP1

# LCAM gate gets the two ports the DPU does not use. gmem0 (feature read)
# and gmem2 (feature write) are deliberately on DIFFERENT ports so the
# streaming read and write do not contend -- this kernel is purely
# memory-bound. gmem1 is the per-pixel weight vector, 1/C of the traffic,
# so it rides along on HP3.
sp=lcam_attention_gate_opt_1.m_axi_gmem0:HP2
sp=lcam_attention_gate_opt_1.m_axi_gmem1:HP3
sp=lcam_attention_gate_opt_1.m_axi_gmem2:HP3

[advanced]
misc=:solution_name=link

[vivado]
prop=run.impl_1.strategy=Performance_Explore

# PARALLELISM IS CAPPED ON PURPOSE. v++ defaults to 8 concurrent
# block-level synthesis jobs; on this 16 GB Windows machine that exhausts
# kernel resources and the run dies with
#   boost::filesystem::status: Insufficient system resources exist to
#   complete the requested service: ".../.create_bd.end.rst"
# which looks like a tool bug but is just Windows running out of handles /
# paged pool. Same root cause as the [Common 17-232] "Could not create
# slave interpreter" failure that blocked the platform build until
# general.maxThreads was forced to 1.
synth.jobs=2
impl.jobs=2
